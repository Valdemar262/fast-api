name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chancery_test
          POSTGRES_USER: chancery
          POSTGRES_PASSWORD: chancery
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Type check
        run: uv run mypy src tests

      - name: Tests
        run: uv run pytest -v --cov=src/app --cov-report=term-missing
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: chancery_test
          POSTGRES_USER: chancery
          POSTGRES_PASSWORD: chancery
          TEST_POSTGRES_DB: chancery_test
          REDIS_PASSWORD: unused
          JWT_SECRET_KEY: ci-secret-not-used-in-production